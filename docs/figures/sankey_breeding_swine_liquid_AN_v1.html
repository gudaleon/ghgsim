ue":6933.955474286},{"gas":"CH4","source":"gas.CH4","target":"sink.CO2e","units":"kg CO2e","value":97142.304},{"gas":"N2O","source":"gas.N2O","target":"sink.CO2e","units":"kg CO2e","value":6933.955474286},{"gas":"CH4","source":"process.enteric_ch4","target":"gas.CH4","units":"kg CO2e","value":8400.0},{"gas":"CH4","source":"process.manure_ch4.liquid_nocrust","target":"gas.CH4","units":"kg CO2e","value":88742.304},{"gas":"N2O","source":"process.manure_n2o_indirect","target":"gas.N2O","units":"kg CO2e","value":6933.955474286}],"nodes":[{"color":"#1565C0","id":"animal.breeding_swine","inflow":0.0,"kind":"animal","label":"breeding swine","layer":0,"outflow":104076.259474286,"value":104076.259474286},{"color":"#00838F","id":"process.enteric_ch4","inflow":8400.0,"kind":"process","label":"enteric CH4","layer":1,"outflow":8400.0,"value":8400.0},{"color":"#00838F","id":"process.manure_ch4.liquid_nocrust","inflow":88742.304,"kind":"process","label":"manure CH4 (liquid, no crust)","layer":1,"outflow":88742.304,"value":88742.304},{"color":"#00838F","id":"process.manure_n2o_indirect","inflow":6933.955474286,"kind":"process","label":"indirect N2O","layer":1,"outflow":6933.955474286,"value":6933.955474286},{"color":"#EF6C00","id":"gas.CH4","inflow":97142.304,"kind":"gas","label":"CH4 (GWP 28)","layer":2,"outflow":97142.304,"value":97142.304},{"color":"#6A1B9A","id":"gas.N2O","inflow":6933.955474286,"kind":"gas","label":"N2O (GWP 265)","layer":2,"outflow":6933.955474286,"value":6933.955474286},{"color":"#37474F","id":"sink.CO2e","inflow":104076.259474286,"kind":"sink","label":"total CO2e","layer":3,"outflow":0.0,"value":104076.259474286}],"totals":{"CH4_enteric_kg":300.0,"CH4_kg":3469.368,"CH4_manure_kg":3169.368,"CO2e_kg":104076.259474286,"CO2e_t":104.076259474,"N2O_direct_kg":0.0,"N2O_indirect_kg":26.165869714,"N2O_kg":26.165869714,"N2O_soil_kg":0.0},"units":"kg CO2e","view":"source_correct"}};
    document.getElementById("farm").textContent = FARM;
    document.getElementById("ver").textContent = VERSION;
    function draw(name) {
      const view = VIEWS[name];
      const nodes = view.nodes;
      const index = Object.fromEntries(nodes.map((n, i) => [n.id, i]));
      const trace = {
        type: "sankey",
        arrangement: "snap",
        node: {
          pad: 16,
          thickness: 16,
          label: nodes.map(n => n.label + "\n" + n.value.toFixed(3) + " kg CO2e"),
          color: nodes.map(n => n.color),
        },
        link: {
          source: view.links.map(l => index[l.source]),
          target: view.links.map(l => index[l.target]),
          value: view.links.map(l => l.value),
          color: view.links.map(l => "rgba(120,144,156,0.35)"),
        },
      };
      Plotly.react("chart", [trace], {
        title: FARM + " — " + name + " (" + view.units + ")",
        font: { size: 12 },
        margin: { l: 20, r: 20, t: 40, b: 20 },
      }, {responsive: true, displaylogo: false});
    }
    const sel = document.getElementById("view");
    sel.addEventListener("change", () => draw(sel.value));
    draw("source_correct");
  </script>
</body>
</html>

# ---------------------------------------------------------------------------
# Manure storage variants. 100% liquid is ILLUSTRATIVE (isolates CE-14).
# Covered farms keep system=liquid_nocrust so default MCF is unchanged and
# only the holos_as_coded remaining factor (0.60 crust / 0.75 solid) differs.
# When the cover fork applies, IPCC with-crust MCF is not also used.
# ---------------------------------------------------------------------------
manure_variants:
  liquid_uncovered:
    systems:
      liquid_nocrust: 1.0
    cover_type: none
    systems_status: ILLUSTRATIVE
    systems_note: "100% liquid/slurry without crust. Not an EPA Table A-157 state mix. Chosen so cover_type is the only manure-storage difference across variants."
    cover_source: "Module default cover_type=none; IPCC 2006 Table 10.17 liquid/slurry without natural crust MCF is used (15C = 0.27)."

  liquid_covered_crust:
    systems:
      liquid_nocrust: 1.0
    cover_type: natural_crust
    systems_status: ILLUSTRATIVE
    cover_source: "HOLOS.CH4.cover_reduction holos_as_coded multiplies CH4 by (1 - HOLOS.COVER.natural_crust_reduction) = 0.60. Default (source_correct) does not apply that factor; MCF stays Table 10.17 liquid_nocrust. IPCC with-crust MCF is not stacked."

  liquid_covered_solid:
    systems:
      liquid_nocrust: 1.0
    cover_type: solid_cover
    systems_status: ILLUSTRATIVE
    cover_source: "HOLOS.CH4.cover_reduction holos_as_coded multiplies CH4 by (1 - HOLOS.COVER.solid_cover_reduction) = 0.75. 0.25 reduction applies to solid cover only."

  poultry_with_litter:
    systems:
      poultry_with_litter: 1.0
    cover_type: none
    systems_status: ILLUSTRATIVE
    systems_note: "100% poultry manure with litter. IPCC 2006 Table 10.17 MCF 1.5% all climates; typical for broilers, turkeys, and litter-based layers."
    cover_source: "No liquid cover. MCF is Table 10.17 poultry with litter."

  poultry_without_litter:
    systems:
      poultry_without_litter: 1.0
    cover_type: none
    systems_status: ILLUSTRATIVE
    systems_note: "100% poultry manure without litter (high-rise / belt). IPCC 2006 Table 10.17 MCF 1.5%."
    cover_source: "No liquid cover. MCF is Table 10.17 poultry without litter."

  swine_liquid_uncovered:
    systems:
      liquid_nocrust: 1.0
    cover_type: none
    systems_status: ILLUSTRATIVE
    systems_note: "100% liquid/slurry without crust. Isolates swine VS/B0/FracGasMS."
    cover_source: "IPCC 2006 Table 10.17 liquid/slurry without crust MCF (15C = 0.27)."

  swine_pit:
    systems:
      pit: 1.0
    cover_type: none
    systems_status: ILLUSTRATIVE
    systems_note: "100% pit storage >1 month (Table 10A-7 Pit >1 month MCF = liquid/slurry)."
    cover_source: "No cover. MCF_pit_gt1mo 15C = 0.27."

# ---------------------------------------------------------------------------
# Farms. Each of dairy (forage and high-grain) and beef cow-calf is run
# with uncovered and covered liquid storage.
# ---------------------------------------------------------------------------
farms:
  - id: dairy_forage_uncovered
    farm_type: dairy
    diet_id: dairy_forage
    manure_id: liquid_uncovered
    herds: [dairy_cow, dairy_heifer, dairy_calf]
    triggers: [HOLOS.GE.digestibility, HOLOS.ENTERIC.calf_zero, HOLOS.VS.digestibility, HOLOS.VS.calf_coeff, HOLOS.NEX.calf_nrate, HOLOS.YM.dairy]

  - id: dairy_forage_covered_crust
    farm_type: dairy
    diet_id: dairy_forage
    manure_id: liquid_covered_crust
    herds: [dairy_cow, dairy_heifer, dairy_calf]
    triggers: [HOLOS.CH4.cover_reduction]

  - id: dairy_forage_covered_solid
    farm_type: dairy
    diet_id: dairy_forage
    manure_id: liquid_covered_solid
    herds: [dairy_cow, dairy_heifer, dairy_calf]
    triggers: [HOLOS.CH4.cover_reduction]

  - id: dairy_high_grain_uncovered
    farm_type: dairy
    diet_id: dairy_high_grain
    manure_id: liquid_uncovered
    herds: [dairy_cow, dairy_heifer, dairy_calf]
    diet_overrides_class_DE: true
    triggers: [HOLOS.VS.urinary_energy, HOLOS.GE.digestibility, HOLOS.VS.digestibility]
    note: "Farm-level DE 82.5 and grain 52% make the implemented IPCC and Holos UE switches disagree."

  - id: dairy_high_grain_covered_crust
    farm_type: dairy
    diet_id: dairy_high_grain
    manure_id: liquid_covered_crust
    herds: [dairy_cow, dairy_heifer, dairy_calf]
    diet_overrides_class_DE: true
    triggers: [HOLOS.VS.urinary_energy, HOLOS.CH4.cover_reduction]

  - id: beef_cowcalf_uncovered
    farm_type: beef_cowcalf
    diet_id: beef_forage
    manure_id: liquid_uncovered
    herds: [beef_cow, beef_calf]
    triggers: [HOLOS.GE.digestibility, HOLOS.ENTERIC.calf_zero, HOLOS.VS.digestibility, HOLOS.VS.calf_coeff, HOLOS.NEX.calf_nrate]

  - id: beef_cowcalf_covered_crust
    farm_type: beef_cowcalf
    diet_id: beef_forage
    manure_id: liquid_covered_crust
    herds: [beef_cow, beef_calf]
    triggers: [HOLOS.CH4.cover_reduction]

  - id: beef_cowcalf_covered_solid
    farm_type: beef_cowcalf
    diet_id: beef_forage
    manure_id: liquid_covered_solid
    herds: [beef_cow, beef_calf]
    triggers: [HOLOS.CH4.cover_reduction]

  - id: broiler_litter
    farm_type: poultry
    manure_id: poultry_with_litter
    herds: [broilers]
    triggers: []
    note: "USDA Census broilers; EPA Annex 3.11 Broilers. Enteric CH4 = 0."

  - id: layer_litter
    farm_type: poultry
    manure_id: poultry_with_litter
    herds: [layers]
    triggers: []
    note: "USDA Census layers; EPA Annex 3.11 Layers."

  - id: layer_highrise
    farm_type: poultry
    manure_id: poultry_without_litter
    herds: [layers]
    triggers: []
    note: "Layers without litter (IPCC layers-dry / high-rise)."

  - id: turkey_litter
    farm_type: poultry
    manure_id: poultry_with_litter
    herds: [turkeys]
    triggers: [HOLOS.CH4.turkey_zero]
    note: "USDA/EPA turkeys. holos_as_coded CE-10 zeros manure CH4."

  - id: market_swine_liquid
    farm_type: swine
    manure_id: swine_liquid_uncovered
    herds: [market_swine]
    triggers: []
    note: "USDA other hogs / EPA market swine. Enteric Tier 1 1.5 kg/head/yr."

  - id: breeding_swine_liquid
    farm_type: swine
    manure_id: swine_liquid_uncovered
    herds: [breeding_swine]
    triggers: []
    note: "USDA breeding hogs / EPA breeding swine."

  - id: farrow_to_finish
    farm_type: swine
    manure_id: swine_pit
    herds: [breeding_swine, market_swine]
    triggers: []
    note: "ILLUSTRATIVE farrow-to-finish mix on pit storage."

      status: VERIFIED
      note: "Held for documentation only. HolosEnteric dairy Ym uses the HOLOS.YM.dairy fork (5.6 Canada default vs 6.5 IPCC 2006 Table 10.12), not this EPA cell, so the Ym fork remains isolated."

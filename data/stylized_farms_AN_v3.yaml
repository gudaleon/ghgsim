    status: VERIFIED
  Nrate_broilers_na:
    value: 1.10
    units: "kg N / (1000 kg mass) / day"
    source: "IPCC 2006 Vol 4 Ch 10 Table 10.19 p. 10.59, Broilers (all regions)"
    status: VERIFIED
  Nrate_layers_na:
    value: 0.83

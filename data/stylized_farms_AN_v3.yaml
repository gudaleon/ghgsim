# ---------------------------------------------------------------------------
# Diets. TDN and DE are both given. Pairings of TDN from NRC with DE from
# EPA are constructed (two independently published numbers) and labelled.
# ---------------------------------------------------------------------------
diets:
  dairy_forage:
    label: "Northeast dairy forage-based diet (EPA DE + NRC 68% TDN table diet)"
    pairing: ILLUSTRATIVE
    pairing_note: "DE% is EPA Annex 3.11 Table A-139 dairy cows 2022. TDN% is NRC 2001 Table 14-3 diet TDN. They are not from the same feeding trial. Used together so TDN != DE and the GE/VS digestibility forks can fire."
    DE_percent:
      value: 66.7
      units: "% GE"
      source: "EPA 2025 Annex 3.11 Table A-139, Dairy Cows DE, all listed regions including Northeast, 2022"
      status: VERIFIED
    TDN_percent:
      value: 68.0
      units: "% DM"
      source: "NRC 2001 Nutrient Requirements of Dairy Cattle, Table 14-3 title: 'Values are Appropriate for the Diet Below with 68% TDN'"
      status: VERIFIED
    forage_percent:
      value: 67.0
      units: "% of diet DM"
      source: "NRC 2001 Table 14-3 footnote a: 40% mid-maturity legume hay + 27% normal corn silage + 23% cracked dry shelled corn + 8% soybean meal (48% CP) + 2% mineral and vitamin mix. Forage ingredients = 40 + 27 = 67."
      status: VERIFIED
    grain_percent:
      value: 33.0
      units: "% of diet DM"
      source: "Complement of forage_percent from the same NRC 2001 Table 14-3 footnote a (23 + 8 + 2 = 33)."
      status: VERIFIED
      note: "Grain 33% < Holos 85% switch. DE 66.7 < implemented IPCC 80% switch. Both UE paths = 0.04 (same as the 17-county run)."
    nrc_eq_2_1_note: "NRC 2001 Chapter 2 Equation 2-1: DE (Mcal/kg) = 0.04409 x TDN(%). With IPCC GE density 18.45 MJ/kg = 4.409 Mcal/kg that conversion makes TDN% equal DE% of GE. The TDN and DE values above are therefore not linked by Eq 2-1; they are two published numbers used as an ILLUSTRATIVE pairing."

  dairy_high_grain:
    label: "High-grain diet that crosses the implemented UE switches in opposite directions"
    pairing: ILLUSTRATIVE
    pairing_note: "DE% is EPA Annex 3.11 Table A-139 steer/heifer feedlot 2022 (82.5). TDN% and forage/grain split are NRC 2001 Table 14-4 (78% TDN; 48% forage ingredients). Not one published ration. Constructed so DE >= 80 (implemented IPCC UE -> 0.02) while grain < 85 (Holos UE -> 0.04)."
    DE_percent:
      value: 82.5
      units: "% GE"
      source: "EPA 2025 Annex 3.11 Table A-139, Steer Feedlot and Heifer Feedlot DE, all listed regions, 2022"
      status: VERIFIED
    TDN_percent:
      value: 78.0
      units: "% DM"
      source: "NRC 2001 Table 14-4 title: 'Values Are Appropriate For The Diet Below With 78% TDN' (large-breed cows, live weight 680 kg)"
      status: VERIFIED
    forage_percent:
      value: 48.0
      units: "% of diet DM"
      source: "NRC 2001 Table 14-4 footnote a: 15% immature legume silage + 33% normal corn silage + 34% ground high moisture shelled corn + 12% soybean meal (48% CP) + 2.5% tallow + 1.5% menhaden fish meal + 2% mineral and vitamin mix. Forage ingredients = 15 + 33 = 48."
      status: VERIFIED
    grain_percent:
      value: 52.0
      units: "% of diet DM"
      source: "Complement of forage_percent from the same NRC 2001 Table 14-4 footnote a (34 + 12 + 2.5 + 1.5 + 2 = 52)."
      status: VERIFIED
    ue_switch:
      ipcc_as_implemented: "DE 82.5 >= 80 -> UE = 0.02"
      holos_as_coded: "grain 52 < 85 -> UE = 0.04"
      ipcc_2006_table_10_2: "Table 10.2 p. 10.14 lists feedlot animals fed with >90% concentrate at DE 75-85%. That >90% grain cell is NOT used here, because both switches would then yield UE = 0.02 and the fork would measure zero again."
      ipcc_2006_eq_10_24_grain_text: "Eq 10.24 notes in the 2006 PDF opened this run also mention 85% or more grain. The registered default remains the Phase 2 DE% implementation."

  beef_forage:
    label: "Northeast beef cow-calf forage diet (EPA DE + NRC 68% TDN table diet)"
    pairing: ILLUSTRATIVE
    pairing_note: "DE% is EPA Annex 3.11 Table A-138 Northeast beef cows 2007-2022. TDN% is NRC 2001 Table 14-3 68% TDN forage-heavy diet. Not one published beef ration."
    DE_percent:
      value: 62.5
      units: "% GE"
      source: "EPA 2025 Annex 3.11 Table A-138, Beef Cows DE, Northeast, 2007-2022"
      status: VERIFIED
    TDN_percent:
      value: 68.0
      units: "% DM"
      source: "NRC 2001 Table 14-3, diet with 68% TDN (same table diet as dairy_forage TDN)"
      status: VERIFIED
    forage_percent:
      value: 67.0
      units: "% of diet DM"
      source: "NRC 2001 Table 14-3 footnote a forage ingredients 40% + 27% = 67% (same as dairy_forage)"
      status: VERIFIED
    grain_percent:
      value: 33.0
      units: "% of diet DM"
      source: "Complement of forage_percent from NRC 2001 Table 14-3 footnote a"
      status: VERIFIED
      note: "DE 62.5 < 80 and grain 33 < 85: both UE paths = 0.04. UE disagreement is isolated to dairy_high_grain."


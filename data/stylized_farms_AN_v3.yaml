# Stylized farms that fire every Holos fork that measured zero on the
# 17-county VT/DE mature-cow EPA dataset (HOLOS_CODE_AUDIT_AN_v2.md).
#
# Version: AN_v3
# Date: 2026-11-01
# Does not overwrite: data/stylized_farms_AN_v1.yaml or AN_v2.yaml
# Phase A adds poultry and swine (USDA Census / EPA Annex 3.11 categories).
# Cover types: natural_crust (reduction 0.40, remaining 0.60) and
# solid_cover (reduction 0.25, remaining 0.75). 0.25 is solid cover only.
# Rule: every numeric input cites IPCC 2006/2019, NRC/NASEM, or EPA Annex 3
# with a table/equation number. Values that are not a published cell, or
# pairings of independently published numbers into one diet/farm, are
# labelled ILLUSTRATIVE.
#
# Does not invent emissions. Does not copy Holos source.

meta:
  version: AN_v3
  purpose: Cattle fork farms from AN_v2 plus stylized broiler, layer, turkey,
    market-swine, breeding-swine, and farrow-to-finish farms (Phase A).
  climate_zone: "15C"
  climate_zone_source:
    source: "IPCC 2006 Vol 4 Ch 10 Table 10.17 p. 10.44 (15C column)"
    note: "Same MCF zone as the committed VT/DE county assembly; not a VT weather observation."
  lb_to_kg: 0.45359237
  lb_to_kg_source:
    source: "NIST Handbook 44 Appendix C, avoirdupois pound"
    note: "Conversion factor only. Applied to EPA Table A-128 masses and Table A-132 milk."
  gwp_ar5:
    CH4: 28.0
    N2O: 265.0
    source: "IPCC Fifth Assessment Report, 100-year GWP without climate-carbon feedbacks (same constants as scripts/holos_vt_de_runner_AN_v1.py)"

# ---------------------------------------------------------------------------
# Bibliography (primary sources actually opened this run)
# ---------------------------------------------------------------------------
sources:
  ipcc_2006_ch10:
    title: "2006 IPCC Guidelines for National Greenhouse Gas Inventories, Volume 4, Chapter 10"
    url: "https://www.ipcc-nggip.iges.or.jp/public/2006gl/pdf/4_Volume4/V4_10_Ch10_Livestock.pdf"
  ipcc_2019_ch10:
    title: "2019 Refinement to the 2006 IPCC Guidelines, Volume 4, Chapter 10"
    url: "https://www.ipcc-nggip.iges.or.jp/public/2019rf/vol4.html"
  epa_2025_annex_3_11:
    title: "EPA (2025) Inventory of U.S. GHG Emissions and Sinks 1990-2023, EPA 430-R-25-003, Annex 3.11"
    url: "https://ghgi.cgs.umd.edu/Web%20Content/FAQ%20Files/US-GHG-Inventory-2025-Annexes.pdf"
    note: "FOIA-release annex PDF. Table numbers below were read from this file this run."
  nrc_2001:
    title: "NRC (2001) Nutrient Requirements of Dairy Cattle, 7th revised edition, National Academy Press"
    note: "Chapter 2 Eq 2-1; Chapter 14 Tables 14-3 and 14-4 (requirement-table diet TDN and ingredient footnotes)."

# ---------------------------------------------------------------------------
# Constants used by the runner (all cited)
# ---------------------------------------------------------------------------
constants:
  Cfi_lactating:
    value: 0.386
    units: "MJ / day / kg^0.75"
    source: "IPCC 2006 Vol 4 Ch 10 Table 10.4 p. 10.16, Cattle/Buffalo (lactating cows)"
    status: VERIFIED
  Cfi_non_lactating:
    value: 0.322
    units: "MJ / day / kg^0.75"
    source: "IPCC 2006 Vol 4 Ch 10 Table 10.4 p. 10.16, Cattle/Buffalo (non-lactating cows, steers and juveniles)"
    status: VERIFIED
  Ca_stall:
    value: 0.00
    units: "dimensionless"
    source: "IPCC 2006 Vol 4 Ch 10 Table 10.5 p. 10.17, Stall"
    status: VERIFIED
  Ca_pasture:
    value: 0.17
    units: "dimensionless"
    source: "IPCC 2006 Vol 4 Ch 10 Table 10.5 p. 10.17, Pasture"
    status: VERIFIED
  Cpregnancy_cattle:
    value: 0.10
    units: "dimensionless"
    source: "IPCC 2006 Vol 4 Ch 10 Table 10.7 p. 10.19, Cattle and Buffalo"
    status: VERIFIED
  pregnant_fraction_na_dairy:
    value: 0.90
    units: "fraction of mature females"
    source: "IPCC 2006 Vol 4 Ch 10 Table 10A-1 p. 10.72-10.77 region row North America, column %Pregnant = 90%"
    status: VERIFIED
  milk_fat_pct:
    value: 4.0
    units: "% by weight"
    source: "IPCC 2006 Vol 4 Ch 10 Equation 10.8 p. 10.17 example ('e.g., 4%'); Equation 10.33 p. 10.58 assumption '%Fat is an input, assumed to be 4%'"
    status: VERIFIED
    note: "EPA Annex 3.11 footnote 100 says US milk fat varies by year from USDA ERS Dairy Data. That 2022 cell was not read this run. 4.0% is the IPCC example/assumption, not a USDA 2022 observation."
  ASH_percent:
    value: 8.0
    units: "% DM"
    source: "IPCC 2006 Vol 4 Ch 10 Equation 10.24 text p. 10.54, example 'e.g., 0.08 for cattle'"
    status: SOURCE-TRACED
  Nrate_dairy_na:
    value: 0.44
    units: "kg N / (1000 kg mass) / day"
    source: "IPCC 2006 Vol 4 Ch 10 Table 10.19 p. 10.59, Dairy Cattle, North America"
    status: VERIFIED
  Nrate_other_cattle_na:
    value: 0.31
    units: "kg N / (1000 kg mass) / day"
    source: "IPCC 2006 Vol 4 Ch 10 Table 10.19 p. 10.59, Other Cattle, North America"
    status: VERIFIED
  ue_ipcc_de_threshold:
    value: 80.0
    units: "% GE"
    source: "Implemented source_correct switch in process_defs.urinary_energy_ipcc (DE_percent >= 80). Phase 2 citation: IPCC 2006 Eq 10.24 text as quoted in docs/HOLOS_PHASE2_FORKS_AN_v1.md (DE% greater than approximately 80%)."
    note: "The IPCC 2006 PDF opened this run (Eq 10.24 notes, extract p. 10.43 in the PDF text layer) also says reduce UE to 0.02 for ruminants fed with 85% or more grain. The registered default follows the Phase 2 DE% implementation, not a new rewrite."
  ue_holos_grain_threshold:
    value: 85.0
    units: "% diet grain"
    source: "data/holos_forks_AN_v2.json HOLOS.VS.urinary_energy holos_as_coded; HOLOS.UE.holos_grain_threshold in holos_params_canada_AN_v4.csv"
    status: SOURCE-TRACED
  Nrate_market_swine_na:
    value: 0.42
    units: "kg N / (1000 kg mass) / day"
    source: "IPCC 2006 Vol 4 Ch 10 Table 10.19 p. 10.59, Swine Market, North America"
    status: VERIFIED
  Nrate_breeding_swine_na:
    value: 0.24

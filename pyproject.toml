[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ghgsim"
version = "0.4.0"
description = "Open GHG simulation framework for agricultural greenhouse gas estimation"
authors = [{name = "Alex Neumann"}]
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
readme = "README.md"
keywords = ["greenhouse gas", "GHG", "agriculture", "IPCC", "simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "numpy>=1.20",
    "pandas>=1.3",
    "scipy>=1.7",
    "pint>=0.20",
    "pyyaml>=6.0",
    "click>=8.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov",
    "SALib>=1.4",
]
sobol = [
    "SALib>=1.4",
]
api = [
    "fastapi>=0.100",
    "uvicorn>=0.20",
]
bayes = [
    "emcee>=3.0",
]
dev = [
    "ruff>=0.1",
    "mypy>=1.0",
    "SALib>=1.4",
]
figures = [
    "plotly>=6",
    "kaleido>=1",
]

[project.scripts]
ghgsim = "ghgsim.api.cli:main"

[project.urls]
Repository = "https://github.com/gudaleon/ghgsim"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ghgsim = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/v3/*.py" = ["E402", "E702"]  # Allow legacy test style (imports, semicolons)

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
